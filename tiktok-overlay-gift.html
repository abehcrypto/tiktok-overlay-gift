<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Overlay - Memes & Galeria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Container do Vídeo do Meme */
        #meme-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 100;
        }

        #meme-container.fullscreen {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            transform: none;
        }

        #meme-video {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #meme-container.fullscreen #meme-video {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: cover;
            border-radius: 0;
        }

        /* Alerta de Agradecimento da Galeria */
        #gallery-alert {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ff0050;
            border-radius: 16px;
            padding: 20px 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.6);
            z-index: 90;
            animation: popup 0.4s ease-out;
        }

        #gallery-alert img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        #gallery-alert h2 {
            font-size: 24px;
            color: #00f2fe;
            text-shadow: 0 0 8px rgba(0,242,254,0.6);
            margin-bottom: 5px;
        }

        #gallery-alert p {
            font-size: 18px;
            font-weight: bold;
        }

        /* Carrossel da Galeria de Presentes */
        #gallery-carousel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(15, 15, 20, 0.8);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 80;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: grayscale(100%) opacity(0.5);
        }

        .gallery-item.active {
            filter: grayscale(0%) opacity(1);
            transform: scale(1.1);
        }

        .gallery-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .gallery-item .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff0050;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        @keyframes popup {
            0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Video Meme -->
    <div id="meme-container">
        <video id="meme-video" playsinline></video>
    </div>

    <!-- Alerta de Galeria -->
    <div id="gallery-alert">
        <img id="alert-img" src="" alt="Presente">
        <h2 id="alert-title">Galeria Iluminada!</h2>
        <p id="alert-user">Obrigado!</p>
    </div>

    <!-- Carrossel de Presentes -->
    <div id="gallery-carousel"></div>

    <!-- Áudio do Alerta -->
    <audio id="alert-audio" src="alert.mp3" preload="auto"></audio>

    <script>
        const CONFIG = {
            // Regras dos Memes com os IDs exatos fornecidos
            memeRules: [
                { ids: ["5879"], keywords: ["rosquinha", "donut"], video: "sebastian.mp4", fullscreen: false },
                { ids: ["5487"], keywords: ["maos fazendo coracao"], video: "menino_de_pau.mp4", fullscreen: false },
                { ids: ["6427"], keywords: ["chapeu e bigode"], video: "chapeu.mp4", fullscreen: false },
                { ids: ["5897"], keywords: ["cisne"], video: "cisne.mp4", fullscreen: false },
                { ids: ["5586"], keywords: ["coracoes"], video: "coracoes.mp4", fullscreen: false },
                { ids: ["6267"], keywords: ["corgi"], video: "corgi.mp4", fullscreen: false },
                { ids: ["12631"], keywords: ["gato assustador"], video: "gato.mp4", fullscreen: false },
                { ids: ["7934"], keywords: ["heart me"], video: "heart.mp4", fullscreen: false },
                { ids: ["5660"], keywords: ["maos em coracao"], video: "maos_em_coracao.mp4", fullscreen: false },
                { ids: ["7168"], keywords: ["pistola de dinheiro"], video: "pistola.mp4", fullscreen: false },
                { ids: ["5655"], keywords: ["rosa"], video: "rosa.mp4", fullscreen: false }
            ],

          // Carrossel completo com o estado atual da sua Galeria (5/9 iluminados)
galleryGifts: [
    { key: "chapeu_bigode", name: "Chapéu e Bigode", image: "chapeu_bigode.png", max: 1, initialCount: 1, ids: ["6427"], keywords: ["chapeu e bigode"] },
    { key: "rosquinha", name: "Rosquinha", image: "rosquinha.png", max: 2, initialCount: 2, ids: ["5879"], keywords: ["rosquinha", "donut"] },
    { key: "maos_fazendo_coracao", name: "Mãos fazendo coração", image: "mãos_fazendo_coração.png", max: 4, initialCount: 4, ids: ["5487"], keywords: ["maos fazendo coracao"] },
    { key: "rosa", name: "Rosa", image: "rosa.png", max: 1, initialCount: 1, ids: ["5655"], keywords: ["rosa"] },
    { key: "maos_em_coracao", name: "Mãos em coração", image: "maos_em_coracao.png", max: 1, initialCount: 1, ids: ["5660"], keywords: ["maos em coracao"] },
    { key: "coracoes", name: "Corações", image: "coracoes.png", max: 1, initialCount: 0, ids: ["5586"], keywords: ["coracoes"] },
    { key: "corgi", name: "Corgi", image: "corgi.png", max: 1, initialCount: 0, ids: ["6267"], keywords: ["corgi"] },
    { key: "pistola_dinheiro", name: "Pistola de dinheiro", image: "pistola.png", max: 1, initialCount: 0, ids: ["7168"], keywords: ["pistola de dinheiro"] },
    { key: "cisne", name: "Cisne", image: "cisne.png", max: 1, initialCount: 0, ids: ["5897"], keywords: ["cisne"] }
]
        };

        const state = {
            galleryCounts: {},
            eventQueue: [],
            isProcessing: false
        };

        // Função para remover acentos e padronizar textos
        function normalizeText(text) {
            if (!text) return "";
            return text.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        // Renderiza a galeria na tela
      function initGallery() {
    const carousel = document.getElementById('gallery-carousel');
    carousel.innerHTML = '';

    CONFIG.galleryGifts.forEach(gift => {
        // Define a contagem inicial (1 ou 0) com base no estado atual da live
        const currentCount = gift.initialCount || 0;
        state.galleryCounts[gift.key] = currentCount;

        const itemDiv = document.createElement('div');
        itemDiv.className = `gallery-item ${currentCount > 0 ? 'active' : ''}`;
        itemDiv.id = `gallery-item-${gift.key}`;

        itemDiv.innerHTML = `
            <img src="${gift.image}" alt="${gift.name}">
            <span class="badge" id="badge-${gift.key}">${currentCount}/${gift.max}</span>
        `;

        carousel.appendChild(itemDiv);
    });
}

        // Processa os presentes recebidos (Simulados ou do Streamer.bot)
        function onGiftReceived(giftData) {
            console.log("[Presente Recebido]", giftData);
            state.eventQueue.push(giftData);
            processQueue();
        }

        async function processQueue() {
            if (state.isProcessing || state.eventQueue.length === 0) return;
            state.isProcessing = true;

            const gift = state.eventQueue.shift();
            const giftId = String(gift.giftId || gift.id || "");
            const giftName = normalizeText(gift.giftName || gift.name || "");
            const count = Number(gift.repeatCount || gift.count || 1);
            const user = gift.nickname || gift.uniqueId || "Fã";

            // 1. Checa e ativa Meme
            const matchedMeme = CONFIG.memeRules.find(rule => 
                (giftId && rule.ids.includes(giftId)) || 
                rule.keywords.some(kw => giftName.includes(normalizeText(kw)))
            );

            if (matchedMeme) {
                await playMeme(matchedMeme.video, matchedMeme.fullscreen);
            }

            // 2. Checa e atualiza Galeria
            const matchedGallery = CONFIG.galleryGifts.find(g => 
                (giftId && g.ids.includes(giftId)) || 
                g.keywords.some(kw => giftName.includes(normalizeText(kw)))
            );

            if (matchedGallery) {
                const current = state.galleryCounts[matchedGallery.key] || 0;
                const updated = Math.min(current + count, matchedGallery.max);
                state.galleryCounts[matchedGallery.key] = updated;

                // Atualiza visual do carrossel
                const badge = document.getElementById(`badge-${matchedGallery.key}`);
                const item = document.getElementById(`gallery-item-${matchedGallery.key}`);
                
                if (badge) badge.innerText = `${updated}/${matchedGallery.max}`;
                if (item && updated > 0) item.classList.add('active');

                // Dispara alerta se subiu a contagem
                if (updated > current) {
                    await triggerGalleryAlert(matchedGallery, user);
                }
            }

            state.isProcessing = false;
            processQueue();
        }

        // Toca o vídeo do meme
        function playMeme(videoSrc, isFullscreen) {
            return new Promise((resolve) => {
                const container = document.getElementById('meme-container');
                const video = document.getElementById('meme-video');

                container.className = isFullscreen ? 'fullscreen' : '';
                video.src = videoSrc;
                container.style.display = 'block';

                video.play().catch(e => console.log("Erro ao reproduzir vídeo:", e));

                video.onended = () => {
                    container.style.display = 'none';
                    video.src = '';
                    resolve();
                };
            });
        }

        // Toca o som alert.mp3 e mostra o card de agradecimento
        function triggerGalleryAlert(galleryGift, username) {
            return new Promise((resolve) => {
                const alertBox = document.getElementById('gallery-alert');
                const alertImg = document.getElementById('alert-img');
                const alertUser = document.getElementById('alert-user');
                const audio = document.getElementById('alert-audio');

                alertImg.src = galleryGift.image;
                alertUser.innerText = `${username} enviou ${galleryGift.name}!`;

                alertBox.style.display = 'flex';

                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Erro ao reproduzir áudio:", e));
                }

                setTimeout(() => {
                    alertBox.style.display = 'none';
                    resolve();
                }, 4000);
            });
        }

        // Conexão com Streamer.bot / WebSocket TikTok
        function setupWebSocket() {
            const ws = new WebSocket("ws://localhost:8080/"); // Porta padrão do Streamer.bot

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event && data.event.source === 'TikTok' && data.event.type === 'Gift') {
                        onGiftReceived(data.data);
                    }
                } catch (e) {
                    // Trata mensagens que não são JSON puro
                }
            };

            ws.onopen = () => console.log("Conectado ao WebSocket de Alertas!");
            ws.onerror = (err) => console.error("Erro no WebSocket:", err);
        }

        // Inicialização
        window.onload = () => {
            initGallery();
            setupWebSocket();
        };
    </script>
</body>
</html>
