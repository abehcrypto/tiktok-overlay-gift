<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABÊ Games — TikTok Overlay Completo</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent !important;
        font-family: 'Press Start 2P', cursive, monospace;
    }

    /* CARROSSEL DE MEMES (Atrás da Câmera) */
    #meme-carousel-container {
        position: absolute;
        top: 140px;
        left: 310px;
        width: 500px;
        background: rgba(15, 12, 30, 0.85);
        border: 2px solid #5d3ebd;
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 0 12px rgba(123, 44, 191, 0.6);
        color: #fff;
        z-index: 10;
    }

    .title {
        text-align: center;
        font-size: 10px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    .carousel-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
    }

    .carousel-track {
        display: flex;
        gap: 10px;
        width: max-content;
        animation: scroll 15s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .meme-card {
        background: rgba(30, 20, 60, 0.7);
        border: 1px solid #7b2cbf;
        border-radius: 8px;
        padding: 6px;
        width: 105px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        margin-top: 4px;
    }

    .meme-img {
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .combo-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background: #ff0055;
        color: #fff;
        font-size: 6px;
        padding: 2px 4px;
        border-radius: 3px;
        font-weight: bold;
        box-shadow: 0 0 4px #ff0055, 1px 1px 2px #000;
        z-index: 2;
    }

    .meme-name {
        font-size: 9px;
        color: #00f5d4;
        text-align: center;
        margin-top: 6px;
        line-height: 1.3;
        text-transform: uppercase;
        text-shadow: 1px 1px 2px #000;
    }

    /* CARROSSEL DA GALERIA (Rodapé) */
    #gallery-carousel-container {
        position: absolute;
        top: 1348px;
        left: 20px;
        width: 1040px;
        height: 180px;
        background: rgba(15, 12, 30, 0.92);
        border: 2px solid #5d3ebd;
        border-radius: 12px;
        padding: 8px 12px;
        box-shadow: 0 0 15px rgba(123, 44, 191, 0.8);
        color: #fff;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .title-gallery {
        text-align: center;
        font-size: 14px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .gallery-track {
        display: flex;
        gap: 14px;
        width: max-content;
        animation: scroll 22s linear infinite;
    }

    .gallery-card {
        background: rgba(20, 15, 40, 0.85);
        border: 2px solid #3d2b7d;
        border-radius: 8px;
        padding: 6px 4px;
        width: 130px;
        height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        filter: grayscale(90%) opacity(0.4);
        transition: all 0.4s ease;
    }

    .gallery-card.unlocked {
        filter: grayscale(0%) opacity(1);
        border-color: #00f5d4;
        box-shadow: 0 0 12px #00f5d4, inset 0 0 8px rgba(0, 245, 212, 0.3);
        background: rgba(0, 245, 212, 0.15);
    }

    .gallery-img {
        width: 55px;
        height: 55px;
        object-fit: contain;
    }

    .gallery-count {
        font-size: 12px;
        color: #ff0055;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }

    .gallery-card.unlocked .gallery-count {
        color: #00f5d4;
    }

    .gallery-name {
        font-size: 8px;
        color: #fff;
        text-align: center;
        line-height: 1.2;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 118px;
    }

    /* ÁREA DO JOGO (VÍDEOS E ALERTA GALERIA) */
    #overlay {
        position: absolute;
        top: 650px;
        left: 0;
        width: 1080px;
        height: 660px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
    }

    #overlay.fullscreen {
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 9999;
    }

    #video {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    #overlay.fullscreen #video {
        object-fit: cover;
    }

    /* Pop-up de Agradecimento da Galeria */
    #alert-pop {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: popIn 0.5s ease-out;
    }

    #alert-pop img {
        width: 220px;
        height: 220px;
        object-fit: contain;
        filter: drop-shadow(0 0 35px #00f5d4);
    }

    #alert-pop .alert-text {
        margin-top: 15px;
        font-size: 16px;
        color: #00f5d4;
        text-shadow: 3px 3px 6px #000;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.4;
    }

    @keyframes popIn {
        0% { transform: scale(0.1); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 99999;
        padding: 4px 7px;
        border-radius: 4px;
        background: rgba(0,0,0,.7);
        color: white;
        font: 10px Arial, sans-serif;
        pointer-events: none;
    }
</style>
</head>

<body>

<!-- Carrossel de Memes -->
<div id="meme-carousel-container">
    <div class="title">✨ PRESENTES X MEMES ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="meme-track"></div>
    </div>
</div>

<!-- Carrossel da Galeria -->
<div id="gallery-carousel-container">
    <div class="title-gallery">✨ LIGHT UP MY GALLERY ✨</div>
    <div class="carousel-wrapper">
        <div class="gallery-track" id="gallery-track"></div>
    </div>
</div>

<!-- Área da Tela de Jogo (Vídeos e Alerta) -->
<div id="overlay">
    <video id="video" playsinline preload="auto"></video>
    <div id="alert-pop">
        <img id="alert-img" src="" alt="Alerta">
        <div class="alert-text" id="alert-title">OBRIGADO POR ILUMINAR MINHA GALERIA!</div>
    </div>
</div>

<audio id="audio-default" src="dinheiro.mp3" preload="auto"></audio>
<audio id="audio-alert" src="alert.mp3" preload="auto"></audio>

<div id="status">🔄 Conectando ao Streamer.bot...</div>

<script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>

<script>
const CONFIG = {
    actionName: "PRESENTES",

    memeList: [
        { name: "Plankton Bolado", image: "rosa.png" },
        { name: "Yamete Kudasai", image: "rosa.png", combo: "x10" },
        { name: "Menino de Pau", image: "mãos_fazendo_coração.png" },
        { name: "Eu Vim Ver o Mamaco", image: "heart_me.png" },
        { name: "Sebastian", image: "rosquinha.png" },
        { name: "Susto", image: "chapéu_e_bigode.png" },
        { name: "Gato Assustador", image: "gato_assustador.png" }
    ],

    memeRules: [
        { keywords: ["heart me", "heart_me", "7934"], video: "mamaco.mp4", fullscreen: false },
        { keywords: ["chapéu e bigode", "chapeu e bigode", "chapéu_e_bigode", "6427"], video: "susto.mp4", fullscreen: false },
        { keywords: ["rosquinha", "donut", "5879"], video: "sebastian.mp4", fullscreen: false },
        { keywords: ["mãos fazendo coração", "maos fazendo coracao", "5487"], video: "menino_de_pau.mp4", fullscreen: false },
        { keywords: ["gato assustador", "gato", "12631"], video: "gato.mp4", fullscreen: true }
    ],

    galleryGifts: [
        { key: "rosa", name: "Rosa", image: "rosa.png", max: 10, keywords: ["rosa", "rose", "5655"] },
        { key: "maos_coracao_4", name: "Mãos fazendo cora...", image: "mãos_fazendo_coração.png", max: 4, keywords: ["mãos fazendo coração", "maos fazendo coracao", "5487"] },
        { key: "rosquinha", name: "Rosquinha", image: "rosquinha.png", max: 2, keywords: ["rosquinha", "donut", "5879"] },
        { key: "chapeu", name: "Chapéu e Bigode", image: "chapéu_e_bigode.png", max: 1, keywords: ["chapéu e bigode", "chapeu e bigode", "chapéu_e_bigode", "6427"] },
        { key: "maos_coracao_1", name: "Mãos em coração", image: "mãos_em_coração.png", max: 1, keywords: ["mãos em coração", "maos em coracao"] },
        { key: "coracoes", name: "Corações", image: "corações.png", max: 1, keywords: ["corações", "coracoes", "hearts"] },
        { key: "corgi", name: "Corgi", image: "corgi.png", max: 1, keywords: ["corgi"] },
        { key: "pistola", name: "Pistola de dinheiro", image: "pistola_de_dinheiro.png", max: 1, keywords: ["pistola de dinheiro", "pistola"] },
        { key: "cisne", name: "Cisne", image: "cisne.png", max: 1, keywords: ["cisne", "swan"] }
    ],

    roseKeywords: ["rosa", "rose", "5655"],
    yameteFile: "yamete.mp4",
    planktonFile: "plankton.mp4",
    defaultAudioFile: "dinheiro.mp3",
    showStatus: true
};

const overlay = document.getElementById("overlay");
const video = document.getElementById("video");
const alertPop = document.getElementById("alert-pop");
const alertImg = document.getElementById("alert-img");
const audioDefault = document.getElementById("audio-default");
const audioAlert = document.getElementById("audio-alert");
const status = document.getElementById("status");

let playing = false;
let queue = [];

function getLastMonday() {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(d.setDate(diff));
    monday.setHours(0, 0, 0, 0);
    return monday.getTime();
}

function initGalleryStorage() {
    const storageKey = "gallery_progress_data";
    const lastResetKey = "gallery_last_reset_monday";
    
    const currentMonday = getLastMonday();
    const savedMonday = localStorage.getItem(lastResetKey);

    if (!savedMonday || parseInt(savedMonday) < currentMonday) {
        localStorage.setItem(storageKey, JSON.stringify({}));
        localStorage.setItem(lastResetKey, currentMonday.toString());
    }
}

function renderMemeCarousel() {
    const track = document.getElementById("meme-track");
    track.innerHTML = "";
    const fullList = [...CONFIG.memeList, ...CONFIG.memeList];

    fullList.forEach(item => {
        const card = document.createElement("div");
        card.className = "meme-card";
        const comboHTML = item.combo ? `<div class="combo-badge">COMBO ${item.combo}</div>` : "";
        card.innerHTML = `
            ${comboHTML}
            <img class="meme-img" src="${item.image}" alt="${item.name}">
            <div class="meme-name">${item.name}</div>
        `;
        track.appendChild(card);
    });
}

function renderGalleryCarousel() {
    const track = document.getElementById("gallery-track");
    track.innerHTML = "";

    const galleryProgress = JSON.parse(localStorage.getItem("gallery_progress_data")) || {};
    const fullGallery = [...CONFIG.galleryGifts, ...CONFIG.galleryGifts];

    fullGallery.forEach(item => {
        const currentCount = galleryProgress[item.key] || 0;
        const isUnlocked = currentCount >= item.max;

        const card = document.createElement("div");
        card.className = `gallery-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
            <img class="gallery-img" src="${item.image}" alt="${item.name}">
            <div class="gallery-count">${currentCount}/${item.max}</div>
            <div class="gallery-name">${item.name}</div>
        `;
        track.appendChild(card);
    });
}

function setStatus(text) {
    if (CONFIG.showStatus) {
        status.textContent = text;
        status.style.display = "block";
    } else {
        status.style.display = "none";
    }
}

async function processQueue() {
    if (playing || queue.length === 0) return;
    playing = true;

    const item = queue.shift();

    try {
        if (item.type === "gallery_alert") {
            alertImg.src = item.image;
            alertPop.style.display = "flex";

            audioAlert.volume = 1.0;
            audioAlert.currentTime = 0;
            await audioAlert.play();

            await new Promise(r => setTimeout(r, 4000));
            alertPop.style.display = "none";

        } else if (item.type === "video") {
            if (item.fullscreen) overlay.classList.add("fullscreen");
            else overlay.classList.remove("fullscreen");

            video.pause();
            video.currentTime = 0;
            video.volume = 1.0;
            video.src = item.file;
            video.style.display = "block";

            await video.play();

            await new Promise(resolve => {
                const finish = () => {
                    video.removeEventListener("ended", finish);
                    video.removeEventListener("error", finish);
                    resolve();
                };
                video.addEventListener("ended", finish, { once: true });
                video.addEventListener("error", finish, { once: true });
            });

            video.pause();
            video.removeAttribute("src");
            video.load();
            video.style.display = "none";
            overlay.classList.remove("fullscreen");

        } else if (item.type === "audio") {
            audioDefault.volume = 1.0;
            audioDefault.currentTime = 0;
            await audioDefault.play();
            await new Promise(r => setTimeout(r, 1500));
        }
    } catch (e) {
        console.error("Erro na fila de execução:", e);
        alertPop.style.display = "none";
        video.style.display = "none";
        overlay.classList.remove("fullscreen");
    }

    playing = false;
    processQueue();
}

function handleStreamerbotAction(data) {
    if (!data) return;

    const actionName = data.name || data.actionName || "";
    if (actionName !== CONFIG.actionName) return;

    const args = data.arguments || {};
    const giftInput = String(args.giftName || args.gift_name || args.giftId || "").toLowerCase().trim();
    
    // Pega a quantidade do combo enviada (padrão é 1 se não vier informado)
    const rawRepeat = args.repeatCount || args.repeat_count || args.count || 1;
    const repeatCount = Math.max(1, parseInt(rawRepeat) || 1);

    // --- 1. ATUALIZA A GALERIA ---
    const targetGalleryItem = CONFIG.galleryGifts.find(g => 
        g.keywords.some(kw => giftInput.includes(kw))
    );

    if (targetGalleryItem) {
        const storageKey = "gallery_progress_data";
        const galleryProgress = JSON.parse(localStorage.getItem(storageKey)) || {};
        const currentQty = galleryProgress[targetGalleryItem.key] || 0;

        if (currentQty < targetGalleryItem.max) {
            const newQty = Math.min(targetGalleryItem.max, currentQty + repeatCount);
            galleryProgress[targetGalleryItem.key] = newQty;
            localStorage.setItem(storageKey, JSON.stringify(galleryProgress));
            renderGalleryCarousel();

            // Se atingiu a meta com este combo, solta o alerta de galeria completa
            if (newQty >= targetGalleryItem.max) {
                queue.push({
                    type: "gallery_alert",
                    image: targetGalleryItem.image,
                    name: targetGalleryItem.name
                });
            }
        }
    }

    // --- 2. EXECUTA OS MEMES NA LIVE (ENFILEIRA DE ACORDO COM O COMBO) ---
    const isRose = CONFIG.roseKeywords.some(kw => giftInput.includes(kw));
    if (isRose) {
        if (repeatCount >= 10) {
            // Se o combo de rosas foi >= 10 de uma vez, toca o Yamete
            queue.push({ type: "video", file: CONFIG.yameteFile, fullscreen: false });
        } else {
            // Senão, toca o Plankton a quantidade de vezes que a pessoa mandou a rosa no combo
            for (let i = 0; i < repeatCount; i++) {
                queue.push({ type: "video", file: CONFIG.planktonFile, fullscreen: false });
            }
        }
        processQueue();
        return;
    }

    const matchedMeme = CONFIG.memeRules.find(rule => 
        rule.keywords.some(kw => giftInput.includes(kw))
    );

    if (matchedMeme) {
        for (let i = 0; i < repeatCount; i++) {
            queue.push({ type: "video", file: matchedMeme.video, fullscreen: matchedMeme.fullscreen });
        }
        processQueue();
        return;
    }

    // Áudio padrão
    for (let i = 0; i < repeatCount; i++) {
        queue.push({ type: "audio", file: CONFIG.defaultAudioFile });
    }
    processQueue();
}

function connectStreamerbot() {
    try {
        setStatus("🔄 Conectando ao Streamer.bot...");
        window.streamerbotClient = new StreamerbotClient({
            host: "127.0.0.1",
            port: 8080,
            endpoint: "/"
        });

        window.streamerbotClient.on("Raw.Action", ({ event, data }) => {
            handleStreamerbotAction(data);
        });

        setStatus("🟢 Overlay Unificado Conectado!");
        setTimeout(() => {
            if (CONFIG.showStatus) status.style.display = "none";
        }, 3000);

    } catch (error) {
        setStatus("🔴 Erro ao conectar ao Streamer.bot");
        setTimeout(connectStreamerbot, 5000);
    }
}

window.addEventListener("load", () => {
    initGalleryStorage();
    renderMemeCarousel();
    renderGalleryCarousel();
    connectStreamerbot();
});
</script>
</body>
</html>
