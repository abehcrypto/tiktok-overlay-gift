<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABÊ Games — TikTok Overlay Unificado</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent !important;
        font-family: 'Press Start 2P', cursive, monospace;
    }

    #meme-carousel-container {
        position: absolute;
        top: 130px;
        left: 40px;
        width: 1000px;
        background: rgba(15, 12, 30, 0.92);
        border: 2px solid #5d3ebd;
        border-radius: 14px;
        padding: 14px 12px 18px 12px;
        box-shadow: 0 0 20px rgba(123, 44, 191, 0.9);
        color: #fff;
        z-index: 10;
    }

    .title {
        text-align: center;
        font-size: 16px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #gallery-carousel-container {
        position: absolute;
        top: 1348px;
        left: 20px;
        width: 1040px;
        height: 180px;
        background: rgba(15, 12, 30, 0.92);
        border: 2px solid #5d3ebd;
        border-radius: 12px;
        padding: 8px 12px;
        box-shadow: 0 0 15px rgba(123, 44, 191, 0.8);
        color: #fff;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .title-gallery {
        text-align: center;
        font-size: 14px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .carousel-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
    }

    .carousel-track {
        display: flex;
        gap: 16px;
        width: max-content;
        animation: scroll 22s linear infinite;
    }

    #meme-track {
        gap: 16px;
        animation: scroll 18s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .meme-card {
        background: rgba(30, 20, 60, 0.88);
        border: 2px solid #7b2cbf;
        border-radius: 12px;
        padding: 10px 6px;
        width: 170px;
        height: 155px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
    }

    .meme-img {
        width: 85px;
        height: 85px;
        object-fit: contain;
    }

    .combo-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        background: #ff0055;
        color: #fff;
        font-size: 9px;
        padding: 3px 6px;
        border-radius: 4px;
        font-weight: bold;
        box-shadow: 0 0 6px #ff0055, 1px 1px 2px #000;
        z-index: 2;
    }

    .meme-name {
        font-size: 11px;
        color: #00f5d4;
        text-align: center;
        line-height: 1.3;
        text-transform: uppercase;
        text-shadow: 1px 1px 2px #000;
    }

    .gallery-card {
        background: rgba(20, 15, 40, 0.85);
        border: 2px solid #3d2b7d;
        border-radius: 8px;
        padding: 6px 4px;
        width: 130px;
        height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        filter: grayscale(90%) opacity(0.4);
        transition: all 0.4s ease;
    }

    .gallery-card.unlocked {
        filter: grayscale(0%) opacity(1);
        border-color: #00f5d4;
        box-shadow: 0 0 12px #00f5d4, inset 0 0 8px rgba(0, 245, 212, 0.3);
        background: rgba(0, 245, 212, 0.15);
    }

    .gallery-img {
        width: 55px;
        height: 55px;
        object-fit: contain;
    }

    .gallery-count {
        font-size: 12px;
        color: #ff0055;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }

    .gallery-card.unlocked .gallery-count {
        color: #00f5d4;
    }

    .gallery-name {
        font-size: 8px;
        color: #fff;
        text-align: center;
        line-height: 1.2;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 118px;
    }

    #overlay-video {
        position: absolute;
        top: 650px;
        left: 0;
        width: 1080px;
        height: 660px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        transition: all 0.2s ease;
    }

    #overlay-video.fullscreen {
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 9999;
    }

    #video {
        display: none;
    }

    #chroma-canvas {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
    }

    #overlay-video.fullscreen #chroma-canvas {
        object-fit: cover;
    }

    #overlay-alert {
        position: absolute;
        top: 838px;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 600px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    #alert-pop {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: popIn 0.5s ease-out;
    }

    #alert-pop img {
        width: 220px;
        height: 220px;
        object-fit: contain;
        filter: drop-shadow(0 0 35px #00f5d4);
    }

    #alert-pop .alert-text {
        margin-top: 15px;
        font-size: 18px;
        color: #00f5d4;
        text-shadow: 3px 3px 6px #000;
        text-transform: uppercase;
        text-align: center;
    }

    @keyframes popIn {
        0% { transform: scale(0.1); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 99999;
        padding: 4px 7px;
        border-radius: 4px;
        background: rgba(0,0,0,.7);
        color: white;
        font: 10px Arial, sans-serif;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="meme-carousel-container">
    <div class="title">✨ PRESENTES X MEMES ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="meme-track"></div>
    </div>
</div>

<div id="gallery-carousel-container">
    <div class="title-gallery">✨ LIGHT UP MY GALLERY ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="gallery-track"></div>
    </div>
</div>

<div id="overlay-video">
    <video id="video" playsinline preload="auto" crossorigin="anonymous"></video>
    <canvas id="chroma-canvas"></canvas>
</div>

<div id="overlay-alert">
    <div id="alert-pop">
        <img id="alert-img" src="" alt="Alerta">
        <div class="alert-text" id="alert-title">ITEM ILUMINADO!</div>
    </div>
</div>

<audio id="audio-default" src="dinheiro.mp3" preload="auto"></audio>
<audio id="audio-alert" src="alert.mp3" preload="auto"></audio>

<div id="status">🔄 Conectando...</div>

<script>
const CONFIG = {
    memeList: [
        { name: "Plankton Bolado", image: "rosa.png" },
        { name: "Yamete Kudasai", image: "rosa.png", combo: "x10" },
        { name: "Menino de Pau", image: "mãos_fazendo_coração.png" },
        { name: "Eu Vim Ver o Mamaco", image: "heart_me.png" },
        { name: "Sebastian", image: "rosquinha.png" },
        { name: "Susto", image: "chapéu_e_bigode.png" },
        { name: "Gato Jackson", image: "gato_assustador.png" },
        { name: "Gemidão", image: "Muito_Fofo.png" },
        { name: "FAH", image: "Fogos_de_artif_cio_efeito_aranha.png" },
        { name: "Lion Drougs", image: "Leão.png" },
        { name: "James Docks", image: "Capybara.png" },
        { name: "hã?", image: "Incrivel gatinho.png" },
        { name: "cool", image: "cool.png" },
        { name: "heart", image: "corações.png" },
        { name: "Tobey Emo", image: "Perfume.png" }
    ],

    memeRules: [
        { keywords: ["heart me", "heart_me", "7934"], video: "mamaco.mp4", fullscreen: false, chroma: false },
        { keywords: ["chapéu e bigode", "chapeu e bigode", "chapéu_e_bigode", "chapeu_e_bigode", "cap and mustache", "6427"], video: "susto.mp4", fullscreen: false, chroma: false },
        { keywords: ["rosquinha", "donut", "doughnut", "5879"], video: "sebastian.mp4", fullscreen: false, chroma: false },
        { keywords: ["mãos fazendo coração", "maos fazendo coracao", "mãos_fazendo_coração", "finger heart", "5487"], video: "menino_de_pau.mp4", fullscreen: false, chroma: false },
        { keywords: ["gato assustador", "gato", "cat", "12631"], video: "gato.mp4", fullscreen: true, chroma: false },
        { keywords: ["muito fofo", "muito_fofo", "9355"], video: "ambulancia gemidão.mp4", fullscreen: false, chroma: false },
        { keywords: ["fogos de artifício efeito aranha", "fogos_de_artif_cio_efeito_aranha", "fogos", "aranha", "15100"], video: "fah.mp4", fullscreen: false, chroma: false },
        { keywords: ["leão", "leao", "lion", "6369"], video: "sorrisão lion.mp4", fullscreen: false, chroma: false },
        { keywords: ["capivara", "capybara", "14488"], video: "docks de olho.mp4", fullscreen: false, chroma: false },
        { keywords: ["incrivel gatinho", "incrivel_gatinho", "hã", "ha", "15232"], video: "hã.mp4", fullscreen: false, chroma: false },
        { keywords: ["cool", "127098"], video: "hum.mp4", fullscreen: false, chroma: false },
        { keywords: ["corações", "coracoes", "coração", "coracao", "heart", "5586"], video: "heart play.mp4", fullscreen: false, chroma: false },
        { keywords: ["perfume", "tobey", "tobey emo", "5658"], video: "tobey emo.mp4", fullscreen: false, chroma: true }
    ],
    followVideoFile: "follow.mp4",
    roseKeywords: ["rosa", "rose", "5655"],
    yameteFile: "yamete.mp4",
    planktonFile: "plankton.mp4",

    galleryGifts: [
        { key: "rosa", name: "Rosa", image: "rosa.png", max: 8, keywords: ["rosa", "rose", "5655"] },
        { key: "maos_fazendo_coracao", name: "Mãos fazendo cora...", image: "mãos_fazendo_coração.png", max: 4, keywords: ["mãos fazendo coração", "5487"] },
        { key: "rosquinha", name: "Rosquinha", image: "rosquinha.png", max: 2, keywords: ["rosquinha", "donut", "5879"] },
        { key: "chapeu_e_bigode", name: "Chapéu e Bigode", image: "chapéu_e_bigode.png", max: 1, keywords: ["chapéu e bigode", "6427"] },
        { key: "maos_em_coracao", name: "Mãos em coração", image: "mãos_em_coração.png", max: 1, keywords: ["mãos em coração"] },
        { key: "coracoes", name: "Corações", image: "corações.png", max: 1, keywords: ["corações", "coracoes"] },
        { key: "corgi", name: "Corgi", image: "corgi.png", max: 1, keywords: ["corgi"] },
        { key: "pistola_dinheiro", name: "Pistola de dinheiro", image: "pistola_de_dinheiro.png", max: 1, keywords: ["pistola de dinheiro"] },
        { key: "cisne", name: "Cisne", image: "cisne.png", max: 1, keywords: ["cisne"] },
        { 
            key: "fragmento_esperanca", 
            name: "Um fragmento de...", 
            image: "Um_fragmento_de_esperanca.png", 
            max: 10, 
            keywords: ["fragmento", "fragmento de esperança", "um fragmento de esperança", "59881"] 
        },
        { 
            key: "armadura_guerreiro", 
            name: "Armadura de um gu...", 
            image: "Armadura_de_um_guerreiro.png", 
            max: 1, 
            keywords: ["armadura", "armadura de um guerreiro", "59882"] 
        }
    ],

    defaultAudioFile: "dinheiro.mp3",
    showStatus: true
};

const overlayVideo = document.getElementById("overlay-video");
const video = document.getElementById("video");
const canvas = document.getElementById("chroma-canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const audioDefault = document.getElementById("audio-default");
const audioAlert = document.getElementById("audio-alert");
const alertPop = document.getElementById("alert-pop");
const alertImg = document.getElementById("alert-img");
const alertTitle = document.getElementById("alert-title");
const status = document.getElementById("status");

let playing = false;
let queue = [];
let ws;
let chromaAnimationId = null;

function renderMemeCarousel() {
    const track = document.getElementById("meme-track");
    track.innerHTML = "";
    const fullList = [...CONFIG.memeList, ...CONFIG.memeList];

    fullList.forEach(item => {
        const card = document.createElement("div");
        card.className = "meme-card";
        const comboHTML = item.combo ? `<div class="combo-badge">COMBO ${item.combo}</div>` : "";
        card.innerHTML = `
            ${comboHTML}
            <img class="meme-img" src="${item.image}" alt="${item.name}">
            <div class="meme-name">${item.name}</div>
        `;
        track.appendChild(card);
    });
}

function getMondayKey() {
    const now = new Date();
    const day = now.getDay(); 
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(now.getFullYear(), now.getMonth(), diff);
    
    const yyyy = monday.getFullYear();
    const mm = String(monday.getMonth() + 1).padStart(2, '0');
    const dd = String(monday.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

function initGalleryStorage() {
    const currentWeekKey = getMondayKey();
    const savedWeekKey = localStorage.getItem("gallery_last_reset_week");

    if (savedWeekKey !== currentWeekKey) {
        localStorage.setItem("gallery_progress_data", JSON.stringify({}));
        localStorage.setItem("gallery_last_reset_week", currentWeekKey);
    }

    const storageKey = "gallery_progress_data";
    let progressData = JSON.parse(localStorage.getItem(storageKey)) || {};

    CONFIG.galleryGifts.forEach(item => {
        if (progressData[item.key] === undefined) {
            progressData[item.key] = 0;
        }
    });

    localStorage.setItem(storageKey, JSON.stringify(progressData));
}

function renderGalleryCarousel() {
    const track = document.getElementById("gallery-track");
    track.innerHTML = "";

    const galleryProgress = JSON.parse(localStorage.getItem("gallery_progress_data")) || {};
    const fullGallery = [...CONFIG.galleryGifts, ...CONFIG.galleryGifts];

    fullGallery.forEach(item => {
        const currentCount = galleryProgress[item.key] || 0;
        const isUnlocked = currentCount >= item.max;

        const card = document.createElement("div");
        card.className = `gallery-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
            <img class="gallery-img" src="${item.image}" alt="${item.name}">
            <div class="gallery-count">${currentCount}/${item.max}</div>
            <div class="gallery-name">${item.name}</div>
        `;
        track.appendChild(card);
    });
}

function setStatus(text) {
    if (CONFIG.showStatus) {
        status.textContent = text;
        status.style.display = "block";
    } else {
        status.style.display = "none";
    }
}

function enqueueItem(item) {
    if (!item) return;
    queue.push(item);
    processQueue();
}

function renderChromaFrame() {
    if (video.paused || video.ended) return;

    if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || 1080;
        canvas.height = video.videoHeight || 1920;
    }

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const l = frame.data.length / 4;

    for (let i = 0; i < l; i++) {
        let r = frame.data[i * 4 + 0];
        let g = frame.data[i * 4 + 1];
        let b = frame.data[i * 4 + 2];

        // Filtro para remover o verde dominante
        if (g > 90 && r < 120 && b < 120 && g > r * 1.2 && g > b * 1.2) {
            frame.data[i * 4 + 3] = 0; // Transparente
        }
    }

    ctx.putImageData(frame, 0, 0);
    chromaAnimationId = requestAnimationFrame(renderChromaFrame);
}

async function processQueue() {
    if (playing || queue.length === 0) return;
    playing = true;

    const item = queue.shift();

    try {
        if (item.type === "video") {
            if (item.fullscreen) {
                overlayVideo.classList.add("fullscreen");
            } else {
                overlayVideo.classList.remove("fullscreen");
            }

            video.pause();
            video.currentTime = 0;
            video.src = item.file;

            if (item.chroma) {
                video.style.display = "none";
                canvas.style.display = "block";
            } else {
                canvas.style.display = "none";
                video.style.display = "block";
            }

            await video.play();

            if (item.chroma) {
                renderChromaFrame();
            }

            await new Promise(resolve => {
                let timer = null;

                const finish = () => {
                    if (timer) clearTimeout(timer);
                    if (chromaAnimationId) cancelAnimationFrame(chromaAnimationId);
                    video.removeEventListener("ended", finish);
                    video.removeEventListener("error", finish);
                    resolve();
                };

                video.addEventListener("ended", finish, { once: true });
                video.addEventListener("error", finish, { once: true });

                if (item.maxDuration) {
                    timer = setTimeout(() => {
                        finish();
                    }, item.maxDuration);
                }
            });

            video.pause();
            video.removeAttribute("src");
            video.load();
            video.style.display = "none";
            canvas.style.display = "none";
            overlayVideo.classList.remove("fullscreen");

        } else if (item.type === "alert") {
            alertImg.src = item.image;
            alertTitle.textContent = item.name.toUpperCase();
            alertPop.style.display = "flex";
            
            audioAlert.currentTime = 0;
            await audioAlert.play();

            await new Promise(r => setTimeout(r, 3500));
            alertPop.style.display = "none";

        } else if (item.type === "audio") {
            audioDefault.currentTime = 0;
            await audioDefault.play();
            await new Promise(r => setTimeout(r, 1500));
        }

    } catch (error) {
        console.error("Erro ao processar fila:", item, error);
        video.style.display = "none";
        canvas.style.display = "none";
        alertPop.style.display = "none";
        overlayVideo.classList.remove("fullscreen");
    }

    playing = false;
    processQueue();
}

function processarEventoWebSocket(raw) {
    let args = raw.data?.arguments || raw.data || raw.arguments || raw.event?.properties || {};
    
    const eventType = String(raw.event?.type || raw.data?.type || "").toLowerCase();
    const actionName = String(raw.data?.name || raw.event?.name || args.action || "").toLowerCase();

    if (eventType === "follow" || actionName === "follow") {
        enqueueItem({ type: "video", file: CONFIG.followVideoFile, fullscreen: false, chroma: false, maxDuration: 3000 });
        return;
    }

    const giftInput = String(args.giftName || args.gift_name || args.giftId || args.gift_id || args.rawInput || "").toLowerCase().trim();

    if (giftInput) {
        const repeatCount = Number(args.repeatCount || args.repeat_count || args.coins || args.count || 1);

        const isRose = CONFIG.roseKeywords.some(kw => giftInput.includes(kw));
        if (isRose) {
            if (repeatCount >= 10) {
                enqueueItem({ type: "video", file: CONFIG.yameteFile, fullscreen: false, chroma: false });
            } else {
                for (let i = 0; i < repeatCount; i++) {
                    enqueueItem({ type: "video", file: CONFIG.planktonFile, fullscreen: false, chroma: false });
                }
            }
        } else {
            const matchedMeme = CONFIG.memeRules.find(rule => 
                rule.keywords.some(kw => giftInput.includes(kw))
            );

            if (matchedMeme) {
                enqueueItem({ type: "video", file: matchedMeme.video, fullscreen: matchedMeme.fullscreen, chroma: matchedMeme.chroma || false });
            } else {
                enqueueItem({ type: "audio", file: CONFIG.defaultAudioFile });
            }
        }

        const targetGift = CONFIG.galleryGifts.find(g => 
            g.keywords.some(kw => giftInput.includes(kw))
        );

        if (targetGift) {
            const storageKey = "gallery_progress_data";
            const galleryProgress = JSON.parse(localStorage.getItem(storageKey)) || {};
            const currentQty = galleryProgress[targetGift.key] || 0;

            if (currentQty < targetGift.max) {
                const newQty = Math.min(targetGift.max, currentQty + repeatCount);
                galleryProgress[targetGift.key] = newQty;
                localStorage.setItem(storageKey, JSON.stringify(galleryProgress));
                renderGalleryCarousel();

                if (newQty >= targetGift.max && currentQty < targetGift.max) {
                    enqueueItem({ type: "alert", image: targetGift.image, name: targetGift.name });
                }
            }
        }
    }
}

function conectarWebSocketNativo() {
    setStatus("🔄 Conectando...");

    ws = new WebSocket("ws://127.0.0.1:8080/");

    ws.onopen = () => {
        setStatus("🟢 Conectado!");
        
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: {
                General: ["Custom"],
                Raw: ["Action", "SubAction"],
                TikTok: ["Gift", "Follow"]
            },
            id: "overlay_sub_all"
        }));

        setTimeout(() => {
            if (CONFIG.showStatus) status.style.display = "none";
        }, 3000);
    };

    ws.onmessage = (event) => {
        try {
            const raw = JSON.parse(event.data);
            processarEventoWebSocket(raw);
        } catch (e) {
            console.warn("Erro ao ler evento do WebSocket:", e);
        }
    };

    ws.onclose = () => {
        setStatus("🔴 Reconectando...");
        setTimeout(conectarWebSocketNativo, 3000);
    };

    ws.onerror = () => {
        ws.close();
    };
}

window.addEventListener("load", () => {
    renderMemeCarousel();
    initGalleryStorage();
    renderGalleryCarousel();
    conectarWebSocketNativo();
});
</script>
</body>
</html>
