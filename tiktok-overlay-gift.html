<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABÊ Games — TikTok Overlay Unificado</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent !important;
        font-family: 'Press Start 2P', cursive, monospace;
    }

    #meme-carousel-container {
        position: absolute;
        top: 130px;
        left: 40px;
        width: 1000px;
        background: rgba(15, 12, 30, 0.92);
        border: 2px solid #5d3ebd;
        border-radius: 14px;
        padding: 14px 12px 18px 12px;
        box-shadow: 0 0 20px rgba(123, 44, 191, 0.9);
        color: #fff;
        z-index: 10;
    }

    .title {
        text-align: center;
        font-size: 16px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #gallery-carousel-container {
        position: absolute;
        top: 1348px;
        left: 20px;
        width: 1040px;
        height: 180px;
        background: rgba(15, 12, 30, 0.92);
        border: 2px solid #5d3ebd;
        border-radius: 12px;
        padding: 8px 12px;
        box-shadow: 0 0 15px rgba(123, 44, 191, 0.8);
        color: #fff;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .title-gallery {
        text-align: center;
        font-size: 14px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .carousel-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
    }

    .carousel-track {
        display: flex;
        gap: 16px;
        width: max-content;
        animation: scroll 22s linear infinite;
    }

    #meme-track {
        gap: 16px;
        animation: scroll 18s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .meme-card {
        background: rgba(30, 20, 60, 0.88);
        border: 2px solid #7b2cbf;
        border-radius: 12px;
        padding: 10px 6px;
        width: 170px;
        height: 155px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
    }

    .meme-img {
        width: 85px;
        height: 85px;
        object-fit: contain;
    }

    .combo-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        background: #ff0055;
        color: #fff;
        font-size: 9px;
        padding: 3px 6px;
        border-radius: 4px;
        font-weight: bold;
        box-shadow: 0 0 6px #ff0055, 1px 1px 2px #000;
        z-index: 2;
    }

    .meme-name {
        font-size: 11px;
        color: #00f5d4;
        text-align: center;
        line-height: 1.3;
        text-transform: uppercase;
        text-shadow: 1px 1px 2px #000;
    }

    .gallery-card {
        background: rgba(20, 15, 40, 0.85);
        border: 2px solid #3d2b7d;
        border-radius: 8px;
        padding: 6px 4px;
        width: 130px;
        height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        filter: grayscale(90%) opacity(0.4);
        transition: all 0.4s ease;
    }

    .gallery-card.unlocked {
        filter: grayscale(0%) opacity(1);
        border-color: #00f5d4;
        box-shadow: 0 0 12px #00f5d4, inset 0 0 8px rgba(0, 245, 212, 0.3);
        background: rgba(0, 245, 212, 0.15);
    }

    .gallery-img {
        width: 55px;
        height: 55px;
        object-fit: contain;
    }

    .gallery-count {
        font-size: 12px;
        color: #ff0055;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }

    .gallery-card.unlocked .gallery-count {
        color: #00f5d4;
    }

    .gallery-name {
        font-size: 8px;
        color: #fff;
        text-align: center;
        line-height: 1.2;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 118px;
    }

    #overlay-video {
        position: absolute;
        top: 650px;
        left: 0;
        width: 1080px;
        height: 660px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        transition: all 0.2s ease;
    }

    #overlay-video.fullscreen {
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 9999;
    }

    #video {
        display: none;
    }

    #chroma-canvas {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
    }

    #overlay-video.fullscreen #chroma-canvas {
        object-fit: cover;
    }

    #overlay-alert {
        position: absolute;
        top: 838px;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 600px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    #alert-pop {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: popIn 0.5s ease-out;
    }

    #alert-pop img {
        width: 220px;
        height: 220px;
        object-fit: contain;
        filter: drop-shadow(0 0 35px #00f5d4);
    }

    #alert-pop .alert-text {
        margin-top: 15px;
        font-size: 18px;
        color: #00f5d4;
        text-shadow: 3px 3px 6px #000;
        text-transform: uppercase;
        text-align: center;
    }

    @keyframes popIn {
        0% { transform: scale(0.1); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 99999;
        padding: 4px 7px;
        border-radius: 4px;
        background: rgba(0,0,0,.7);
        color: white;
        font: 10px Arial, sans-serif;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="meme-carousel-container">
    <div class="title">✨ PRESENTES X MEMES ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="meme-track"></div>
    </div>
</div>

<div id="gallery-carousel-container">
    <div class="title-gallery">✨ LIGHT UP MY GALLERY ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="gallery-track"></div>
    </div>
</div>

<div id="overlay-video">
    <video id="video" playsinline preload="auto" crossorigin="anonymous"></video>
    <canvas id="chroma-canvas"></canvas>
</div>

<div id="overlay-alert">
    <div id="alert-pop">
        <img id="alert-img" src="" alt="Alerta">
        <div class="alert-text" id="alert-title">ITEM ILUMINADO!</div>
    </div>
</div>

<audio id="audio-default" src="dinheiro.mp3" preload="auto"></audio>
<audio id="audio-alert" src="alert.mp3" preload="auto"></audio>

<div id="status">🔄 Conectando...</div>

<script>
const CONFIG = {
